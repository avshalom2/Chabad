name: Database restore test

on:
  workflow_dispatch:
    inputs:
      backup_run_id:
        description: Run ID of the successful Database backup workflow
        required: true
        type: string
      confirmation:
        description: Type RESTORE-TO-TEST to confirm
        required: true
        type: string

permissions:
  actions: read
  contents: read

jobs:
  restore-test:
    if: inputs.confirmation == 'RESTORE-TO-TEST'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      PGCONNECT_TIMEOUT: '20'
      PGSSLMODE: verify-full

    steps:
      - name: Check required secrets and safety boundary
        env:
          PRODUCTION_URL: ${{ secrets.NEON_DATABASE_URL }}
          RESTORE_URL: ${{ secrets.NEON_RESTORE_TEST_DATABASE_URL }}
          BACKUP_PASSPHRASE: ${{ secrets.DB_BACKUP_PASSPHRASE }}
        run: |
          set -euo pipefail
          test -n "$PRODUCTION_URL" || { echo 'NEON_DATABASE_URL is missing'; exit 1; }
          test -n "$RESTORE_URL" || { echo 'NEON_RESTORE_TEST_DATABASE_URL is missing'; exit 1; }
          test -n "$BACKUP_PASSPHRASE" || { echo 'DB_BACKUP_PASSPHRASE is missing'; exit 1; }
          test "$PRODUCTION_URL" != "$RESTORE_URL" || { echo 'Refusing to restore to production'; exit 1; }

      - name: Install PostgreSQL 17 client
        run: |
          set -euo pipefail
          sudo install -d /usr/share/postgresql-common/pgdg
          sudo curl -fsSLo /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc https://www.postgresql.org/media/keys/ACCC4CF8.asc
          echo "deb [signed-by=/usr/share/postgresql-common/pgdg/apt.postgresql.org.asc] https://apt.postgresql.org/pub/repos/apt $(. /etc/os-release && echo "$VERSION_CODENAME")-pgdg main" | sudo tee /etc/apt/sources.list.d/pgdg.list > /dev/null
          sudo apt-get update
          sudo apt-get install --yes postgresql-client-17

      - name: Download encrypted backup
        uses: actions/download-artifact@v4
        with:
          name: database-backup-${{ inputs.backup_run_id }}
          run-id: ${{ inputs.backup_run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: backup

      - name: Verify and decrypt backup
        env:
          BACKUP_PASSPHRASE: ${{ secrets.DB_BACKUP_PASSPHRASE }}
        run: |
          set -euo pipefail
          cd backup
          checksum_file="$(find . -maxdepth 1 -name '*.sha256' -print -quit)"
          test -n "$checksum_file" || { echo 'Checksum file not found'; exit 1; }
          sha256sum --check "$checksum_file"
          encrypted_file="${checksum_file%.sha256}"
          openssl enc -d -aes-256-cbc -pbkdf2 -iter 200000 \
            -in "$encrypted_file" \
            -out restore.dump \
            -pass env:BACKUP_PASSPHRASE
          /usr/lib/postgresql/17/bin/pg_restore --list restore.dump > /dev/null

      - name: Replace test database contents and restore
        env:
          RESTORE_URL: ${{ secrets.NEON_RESTORE_TEST_DATABASE_URL }}
        run: |
          set -euo pipefail
          /usr/lib/postgresql/17/bin/pg_restore \
            --dbname="$RESTORE_URL" \
            --clean \
            --if-exists \
            --no-owner \
            --no-privileges \
            --exit-on-error \
            backup/restore.dump

      - name: Verify restored database
        env:
          RESTORE_URL: ${{ secrets.NEON_RESTORE_TEST_DATABASE_URL }}
        run: |
          set -euo pipefail
          table_count="$(/usr/lib/postgresql/17/bin/psql "$RESTORE_URL" -XAtc "select count(*) from pg_tables where schemaname = 'public'")"
          test "$table_count" -gt 0 || { echo 'Restore contains no public tables'; exit 1; }
          echo "Restore test passed with $table_count public tables."
